name: Build and Push to ECR

on:
  workflow_call:
    inputs:
      service_name:
        description: "Name of the service. Used as the ECR repository name."
        required: true
        type: string
      role_arn:
        description: "IAM role ARN assumed via OIDC. Not a secret."
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: us-east-1
    outputs:
      image_tag:
        description: "Short SHA tag of the published image."
        value: ${{ jobs.build-and-push.outputs.image_tag }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Assume role via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.service_name }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.service_name }}:${{ steps.meta.outputs.tag }}

      - name: Publish summary
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "Image published: 
          \`$REGISTRY/$REPOSITORY:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"